name: dirrio-api
services:
  api:
    image: dirrio-server:${RELEASE_VERSION:-local}
    build:
      context: ../..
      dockerfile: deployments/api/Dockerfile
    command: ["bun", "--no-env-file", "apps/api/src/bootstrap.ts"]
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind: { create_host_path: false }
    environment:
      PORT: "3001"
      WORKER_HEALTH_FILE: /tmp/dirrio-worker-health.json
    stop_grace_period: 150s
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    expose: ["3001"]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
  api-proxy:
    build:
      context: ../proxy
      dockerfile: Dockerfile
    ports: ["127.0.0.1:${API_PORT:-8082}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
